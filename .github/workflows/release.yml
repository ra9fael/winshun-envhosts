# Deliberate dispatch avoids publishing when a maintenance tag is merely pushed.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag: gdi/vX.Y.Z or qml/vX.Y.Z'
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.tag.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^(gdi|qml)/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          backend="${RELEASE_TAG%%/*}"
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" "refs/remotes/origin/$backend"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
      tag: ${{ inputs.tag }}
  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: edition-package
          path: dist
      - name: Publish one release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          BACKEND: ${{ needs.verify.outputs.backend }}
        run: |
          latest=false
          if [[ "$BACKEND" == gdi ]]; then latest=true; fi
          gh release create "$RELEASE_TAG" --verify-tag --latest="$latest" \
            --title "${BACKEND^^} ${RELEASE_TAG#*/v}" --notes-file dist/release-notes.md \
            dist/*.wsplugin dist/*.sha256
