<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">EnvHosts editor UI proposal</title>
  <desc id="desc">A Windows-native environment variable editor concept showing stable list selection, explicit custom delimiter application, item editing controls, and a raw value mode comparison.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#243247" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; fill: #202733; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 12px; fill: #687385; }
      .muted { fill: #7b8796; }
      .strong { font-weight: 600; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; }
    </style>
  </defs>

  <rect width="1440" height="1040" fill="#eef2f6"/>
  <text x="52" y="48" font-size="23" font-weight="650">环境变量编辑器</text>
  <text x="52" y="73" font-size="13" fill="#687385">UI 方案 · v0.4 · 变量列表与详情分区，编辑动作集中在当前选中项</text>
  <g transform="translate(1230 34)">
    <rect width="158" height="28" rx="14" fill="#e0e9f5"/>
    <circle cx="17" cy="14" r="4" fill="#2563a6"/>
    <text x="30" y="19" font-size="12" fill="#31577f">分隔项模式</text>
  </g>

  <!-- Main editor window -->
  <g filter="url(#shadow)">
    <rect x="52" y="96" width="1336" height="760" rx="8" fill="#ffffff" stroke="#cbd3de"/>
  </g>
  <path d="M60 96h1320a8 8 0 0 1 8 8v34H52v-34a8 8 0 0 1 8-8z" fill="#f7f9fc"/>
  <path d="M52 138h1336" stroke="#d8dee7"/>
  <g transform="translate(74 111)">
    <rect width="16" height="16" rx="4" fill="#2870b7"/>
    <path d="M4 5h8M4 8h8M4 11h6" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <text x="100" y="124" font-size="13" font-weight="600">环境变量编辑器</text>
  <text x="1290" y="123" font-size="16" fill="#7b8796">−</text>
  <rect x="1314" y="107" width="28" height="24" rx="3" fill="#e8edf3"/>
  <text x="1322" y="124" font-size="13" fill="#495464">□</text>
  <text x="1360" y="124" font-size="16" fill="#7b8796">×</text>

  <!-- Tabs and filter -->
  <g transform="translate(72 153)">
    <rect width="94" height="30" rx="5" fill="#2563a6"/>
    <text x="47" y="20" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">用户 (18)</text>
    <rect x="101" width="94" height="30" rx="5" fill="#edf1f6"/>
    <text x="148" y="20" text-anchor="middle" font-size="13" fill="#536071">系统 (42)</text>
    <rect x="202" width="86" height="30" rx="5" fill="#edf1f6"/>
    <text x="245" y="20" text-anchor="middle" font-size="13" fill="#536071">备份</text>
  </g>
  <text x="390" y="173" class="label">过滤</text>
  <rect x="428" y="153" width="938" height="30" rx="4" fill="#fff" stroke="#cbd3de"/>
  <text x="443" y="173" font-size="13" fill="#758194">按名称或值筛选变量…</text>
  <text x="1340" y="173" font-size="13" fill="#8b96a5">⌕</text>

  <!-- Variable table -->
  <rect x="72" y="198" width="1296" height="286" rx="4" fill="#fff" stroke="#d1d8e2"/>
  <path d="M73 199h1294v34H73z" fill="#f1f4f8"/>
  <text x="91" y="220" class="label" font-weight="600">名称</text>
  <text x="407" y="220" class="label" font-weight="600">类型</text>
  <text x="580" y="220" class="label" font-weight="600">值</text>
  <path d="M390 199v285M560 199v285" stroke="#e4e8ee"/>
  <g class="mono" font-size="12.5">
    <rect x="74" y="234" width="1292" height="34" fill="#fff"/>
    <text x="91" y="256">APP_DATA</text><text x="407" y="256" fill="#6b7584">REG_EXPAND_SZ</text><text x="580" y="256" fill="#475366">%USERPROFILE%\AppData\Local\Sample</text>
    <rect x="74" y="268" width="1292" height="34" fill="#f9fafc"/>
    <text x="91" y="290">LANG</text><text x="407" y="290" fill="#6b7584">REG_SZ</text><text x="580" y="290" fill="#475366">en_US.UTF-8</text>
    <rect x="74" y="302" width="1292" height="34" fill="#fff"/>
    <text x="91" y="324">TEMP</text><text x="407" y="324" fill="#6b7584">REG_EXPAND_SZ</text><text x="580" y="324" fill="#475366">%USERPROFILE%\AppData\Local\Temp</text>
    <rect x="74" y="336" width="1292" height="34" fill="#e7f0fb"/>
    <rect x="74" y="336" width="3" height="34" fill="#2870b7"/>
    <text x="91" y="358" font-weight="700" fill="#174d80">Path</text><text x="407" y="358" fill="#6b7584">REG_EXPAND_SZ</text><text x="580" y="358" fill="#475366">C:\Windows\System32;C:\Windows;D:\tools\Qt\bin;…</text>
    <rect x="74" y="370" width="1292" height="34" fill="#f9fafc"/>
    <text x="91" y="392">PYTHON_HOME</text><text x="407" y="392" fill="#6b7584">REG_SZ</text><text x="580" y="392" fill="#475366">D:\tools\Python</text>
    <rect x="74" y="404" width="1292" height="34" fill="#fff"/>
    <text x="91" y="426">TEMP_ARCHIVE</text><text x="407" y="426" fill="#6b7584">REG_SZ</text><text x="580" y="426" fill="#475366">D:\work\archive</text>
    <rect x="74" y="438" width="1292" height="34" fill="#f9fafc"/>
    <text x="91" y="460">WS_SAMPLE_FLAG</text><text x="407" y="460" fill="#6b7584">REG_SZ</text><text x="580" y="460" fill="#475366">enabled</text>
  </g>

  <!-- Splitter -->
  <rect x="72" y="488" width="1296" height="10" rx="4" fill="#e8edf3"/>
  <g stroke="#9da8b7" stroke-width="1.4" stroke-linecap="round">
    <path d="M696 493h12M716 493h12M736 493h12M756 493h12M776 493h12"/>
  </g>
  <text x="1318" y="496" font-size="10" fill="#7b8796">可拖动</text>

  <!-- Detail panel -->
  <rect x="72" y="502" width="1296" height="288" rx="4" fill="#f8fafc" stroke="#d1d8e2"/>
  <text x="92" y="524" class="label" font-weight="600">变量属性</text>
  <text x="92" y="548" class="label">名称</text>
  <text x="448" y="548" class="label">类型</text>
  <rect x="92" y="556" width="334" height="30" rx="4" fill="#fff" stroke="#cbd3de"/>
  <text x="105" y="576" class="mono" font-size="13">Path</text>
  <rect x="448" y="556" width="300" height="30" rx="4" fill="#fff" stroke="#cbd3de"/>
  <text x="461" y="576" font-size="13">REG_EXPAND_SZ</text>
  <path d="M714 568l5 5 5-5" fill="none" stroke="#788596" stroke-width="1.5"/>

  <!-- Top-right variable actions -->
  <g>
    <rect x="1018" y="552" width="78" height="34" rx="5" fill="#fff" stroke="#bfc9d6"/>
    <text x="1057" y="574" text-anchor="middle" font-size="12" fill="#3e4b5c">＋ 新增</text>
    <rect x="1104" y="552" width="78" height="34" rx="5" fill="#fff" stroke="#bfc9d6"/>
    <text x="1143" y="574" text-anchor="middle" font-size="12" fill="#3e4b5c">− 删除</text>
    <rect x="1190" y="552" width="72" height="34" rx="5" fill="#fff" stroke="#bfc9d6"/>
    <text x="1226" y="574" text-anchor="middle" font-size="12" fill="#3e4b5c">撤销</text>
    <rect x="1270" y="552" width="72" height="34" rx="5" fill="#fff" stroke="#bfc9d6"/>
    <text x="1306" y="574" text-anchor="middle" font-size="12" fill="#3e4b5c">重做</text>
  </g>

  <!-- Unified mode and delimiter toolbar -->
  <text x="92" y="613" class="label">编辑方式</text>
  <g transform="translate(92 620)">
    <rect width="204" height="34" rx="5" fill="#e7ebf1"/>
    <rect x="103" y="3" width="98" height="28" rx="4" fill="#2563a6"/>
    <text x="51" y="22" text-anchor="middle" font-size="12" fill="#4f5c6d">原文编辑</text>
    <text x="152" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">分隔项编辑</text>
  </g>
  <text x="318" y="613" class="label">分隔符</text>
  <rect x="318" y="620" width="220" height="34" rx="5" fill="#fff" stroke="#aeb9c7"/>
  <text x="332" y="642" font-size="13">自定义： ::</text>
  <path d="M513 634l6 6 6-6" fill="none" stroke="#788596" stroke-width="1.5"/>
  <rect x="546" y="620" width="76" height="34" rx="5" fill="#fff" stroke="#bfc9d6"/>
  <text x="584" y="642" text-anchor="middle" font-size="12" fill="#3e4b5c">重置</text>
  <rect x="630" y="620" width="80" height="34" rx="5" fill="#2563a6"/>
  <text x="670" y="642" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">应用</text>
  <circle cx="730" cy="637" r="4" fill="#2c8a66"/>
  <text x="741" y="642" font-size="11" fill="#4c7868">已应用</text>
  <text x="1130" y="642" font-size="11" fill="#7b8796">输入期间不拆分；按“应用”后才更新列表</text>

  <!-- Item list and selected item editor -->
  <text x="92" y="678" class="label">分隔项列表</text>
  <text x="792" y="678" class="label">当前项</text>
  <text x="1342" y="678" text-anchor="end" font-size="11" fill="#647184">第 4 / 6 项</text>
  <rect x="92" y="686" width="676" height="82" rx="4" fill="#fff" stroke="#cbd3de"/>
  <g class="mono" font-size="12.5">
    <rect x="93" y="687" width="674" height="22" fill="#fff"/>
    <text x="108" y="702" fill="#8994a2">1</text><text x="137" y="702">C:\Windows\System32</text>
    <rect x="93" y="709" width="674" height="22" fill="#f8fafc"/>
    <text x="108" y="724" fill="#8994a2">2</text><text x="137" y="724">C:\Windows</text>
    <rect x="93" y="731" width="674" height="22" fill="#fff"/>
    <text x="108" y="746" fill="#8994a2">3</text><text x="137" y="746">C:\Program Files\Git\cmd</text>
    <rect x="93" y="753" width="674" height="15" fill="#e7f0fb"/>
  </g>
  <rect x="93" y="753" width="3" height="15" fill="#2870b7"/>
  <text x="108" y="766" font-size="10" fill="#2870b7">4</text>
  <text x="137" y="766" class="mono" font-size="11" fill="#174d80">D:\tools\Qt\bin</text>
  <text x="750" y="766" text-anchor="end" font-size="10" fill="#7b8796">滚动查看更多</text>

  <rect x="792" y="686" width="550" height="34" rx="4" fill="#fff" stroke="#aeb9c7"/>
  <text x="806" y="708" class="mono" font-size="13">D:\tools\Qt\bin</text>
  <g>
    <rect x="792" y="730" width="92" height="34" rx="5" fill="#fff" stroke="#bfc9d6"/>
    <text x="838" y="752" text-anchor="middle" font-size="12" fill="#3e4b5c">↑ 上移</text>
    <rect x="892" y="730" width="92" height="34" rx="5" fill="#fff" stroke="#bfc9d6"/>
    <text x="938" y="752" text-anchor="middle" font-size="12" fill="#3e4b5c">↓ 下移</text>
    <rect x="1008" y="730" width="92" height="34" rx="5" fill="#fff" stroke="#bfc9d6"/>
    <text x="1054" y="752" text-anchor="middle" font-size="12" fill="#3e4b5c">＋ 插入</text>
    <rect x="1108" y="730" width="92" height="34" rx="5" fill="#fff" stroke="#d4b7b7"/>
    <text x="1154" y="752" text-anchor="middle" font-size="12" fill="#a34f4f">− 删除</text>
  </g>
  <text x="1220" y="751" font-size="11" fill="#758194">Alt+↑↓</text>

  <!-- Status and save controls -->
  <rect x="72" y="800" width="1296" height="42" rx="0 0 4 4" fill="#edf2f7"/>
  <text x="92" y="818" font-size="12" fill="#445164">● 有未保存修改 · 1 项变更 · 用户可写 / 系统只读</text>
  <text x="92" y="836" font-size="11" fill="#748092">Ctrl+Z 撤销　 Ctrl+Y 重做　 Ctrl+S 保存　 F5 重新载入</text>
  <rect x="1244" y="807" width="98" height="28" rx="5" fill="#2870b7"/>
  <text x="1293" y="826" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">保存</text>

  <!-- Raw mode comparison -->
  <g filter="url(#shadow)">
    <rect x="52" y="884" width="780" height="126" rx="7" fill="#fff" stroke="#d1d8e2"/>
  </g>
  <text x="72" y="909" font-size="13" font-weight="600">原文模式：同一位置切换，不改变变量值</text>
  <g transform="translate(72 922)">
    <rect width="204" height="30" rx="5" fill="#e7ebf1"/>
    <rect x="3" y="3" width="98" height="24" rx="4" fill="#2563a6"/>
    <text x="52" y="20" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">原文编辑</text>
    <text x="152" y="20" text-anchor="middle" font-size="11" fill="#4f5c6d">分隔项编辑</text>
  </g>
  <rect x="290" y="922" width="520" height="70" rx="4" fill="#f4f6f9" stroke="#d7dee7"/>
  <text x="306" y="943" font-size="11" fill="#7b8796">值</text>
  <text x="306" y="964" class="mono" font-size="12">C:\Windows\System32;C:\Windows;D:\tools\Qt\bin;…</text>
  <text x="306" y="982" font-size="10.5" fill="#7b8796">多行值区域按原始文本编辑，Ctrl+R 可切换到分隔项模式</text>

  <!-- Behavior notes -->
  <g>
    <rect x="854" y="884" width="534" height="126" rx="7" fill="#f7fafc" stroke="#d1d8e2"/>
    <text x="874" y="909" font-size="13" font-weight="600">交互要点</text>
    <circle cx="879" cy="934" r="3" fill="#2870b7"/><text x="891" y="938" font-size="11.5" fill="#4b5869">选中项留在原视口位置，不因重建列表跳到顶部</text>
    <circle cx="879" cy="956" r="3" fill="#2870b7"/><text x="891" y="960" font-size="11.5" fill="#4b5869">自定义分隔符显式应用；输入中不反复拆分</text>
    <circle cx="879" cy="978" r="3" fill="#2870b7"/><text x="891" y="982" font-size="11.5" fill="#4b5869">项操作只作用于当前项；变量操作保持独立</text>
  </g>
</svg>
