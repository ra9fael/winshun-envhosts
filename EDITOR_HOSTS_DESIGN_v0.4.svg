<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">Hosts editor UI proposal</title>
  <desc id="desc">A hosts editor using the same visual language as the environment variable editor, with enabled state, IP, hostnames and comment fields.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#243247" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; fill: #202733; }
      .label { font-size: 12px; fill: #687385; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; }
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#eef2f6"/>
  <text x="52" y="48" font-size="23" font-weight="650">hosts 编辑器</text>
  <text x="52" y="73" font-size="13" fill="#687385">与环境变量编辑器统一：相同的分区、字段层级、按钮尺寸与状态反馈</text>
