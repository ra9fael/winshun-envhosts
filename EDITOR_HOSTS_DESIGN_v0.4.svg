  <text x="1290" y="123" font-size="16" fill="#7b8796">−</text>
  <rect x="1314" y="107" width="28" height="24" rx="3" fill="#e8edf3"/><text x="1322" y="124" font-size="13" fill="#495464">□</text>
  <text x="1360" y="124" font-size="16" fill="#7b8796">×</text>

