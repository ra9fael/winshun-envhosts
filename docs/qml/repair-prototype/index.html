  </style>
  <div class="eh-review" aria-label="演示场景">
    <span class="eh-muted">修复预览 · 合成数据</span>
    <button data-target="env" aria-pressed="true">环境变量</button>
    <button data-target="hosts" aria-pressed="false">hosts</button>
    <button data-action="appearance">切换明暗</button>
  </div>
  <main class="eh-app">
    <div class="eh-heading">
      <h2 id="eh-title">环境变量</h2><span id="eh-dirty" class="eh-muted"></span><span class="eh-grow"></span>
      <button id="eh-undo" data-action="undo">撤销</button><button id="eh-redo" data-action="redo">重做</button>
      <button id="eh-save" data-action="review" class="primary">保存全部修改</button>
    </div>
    <div id="eh-scopes" class="eh-tabs" aria-label="变量范围">
      <button data-scope="user" aria-pressed="true">用户变量</button><button data-scope="system" aria-pressed="false">系统变量</button>
      <span class="eh-scope-note eh-muted" id="eh-scope-note"></span>

    <div id="eh-host-tabs" class="eh-tabs" aria-label="hosts 视图" hidden>
      <button data-host-page="entries" aria-pressed="true">条目</button><button data-host-page="raw" aria-pressed="false">全文</button>
      <span class="eh-scope-note eh-muted">独立注释、空行和未知行只在全文中显示</span>
    </div>
    <section id="eh-list-panel">

        <button data-action="delete">删除所选</button><button data-action="restore">恢复所选</button>
        <button data-action="enable" class="eh-host-command" hidden>启用</button><button data-action="disable" class="eh-host-command" hidden>停用</button>
        <span id="eh-count" class="eh-count eh-muted"></span>
      </div>
      <div class="eh-table-wrap" aria-label="主列表容器"><table id="eh-table" aria-label="环境变量列表"><colgroup></colgroup><thead></thead><tbody></tbody></table></div>
      <p class="eh-hint" id="eh-list-hint"></p>
    </section>
    <section id="eh-env-detail" class="eh-detail" aria-label="变量详情">
      <div class="eh-detail-grid">
        <label>变量名<input id="eh-name" data-edit="name" autocomplete="off" spellcheck="false"></label>
        <label>类型<select id="eh-type" data-edit="type"><option>REG_SZ</option><option>REG_EXPAND_SZ</option></select></label>
        <div class="eh-tabs" style="margin-bottom:0"><button data-mode="parts" aria-pressed="true">拆分项</button><button data-mode="raw" aria-pressed="false">原始值</button></div>
      </div>
      <section id="eh-parts-panel">
        <div class="eh-toolbar">

          <span class="eh-grow"></span><span id="eh-part-count" class="eh-muted"></span>
        </div>
        <div class="eh-table-wrap eh-parts-wrap"><table id="eh-parts" aria-label="分隔项列表"><colgroup><col style="width:32px"><col style="width:42px"><col><col style="width:86px"></colgroup><thead><tr><th><input id="eh-part-all" type="checkbox" aria-label="全选分隔项"></th><th>序号</th><th>值</th><th>状态</th></tr></thead><tbody></tbody></table></div>
        <label id="eh-part-edit-wrap" hidden>编辑分隔项<input id="eh-part-input" data-edit="part" class="eh-mono" style="width:100%"></label>
      </section>
      <section id="eh-value-panel" hidden><label for="eh-value" class="eh-muted">原始值 · Enter 保留换行，Ctrl+Enter 暂存，Esc 取消</label><textarea id="eh-value" data-edit="value" class="eh-mono" spellcheck="false"></textarea></section>
    </section>
    <section id="eh-host-detail" class="eh-detail" aria-label="hosts 条目详情" hidden><div class="eh-host-fields"><label>IP<input id="eh-ip" data-edit="ip"></label><label>主机名<input id="eh-hostnames" data-edit="names"></label><label>行尾注释<input id="eh-comment" data-edit="comment"></label></div></section>
    <section id="eh-raw-panel" hidden><label for="eh-raw" class="eh-muted">全文预览 · 保留独立注释及空行，已标记删除的映射不再输出</label><textarea id="eh-raw" class="eh-mono eh-raw" readonly spellcheck="false"></textarea></section>

    <section id="eh-dialog" class="eh-dialog" role="region" aria-labelledby="eh-dialog-title" hidden><h3 id="eh-dialog-title"></h3><div id="eh-dialog-body"></div><div class="eh-toolbar"><button data-action="close-review">返回编辑</button><button id="eh-confirm" data-action="confirm" class="primary">确认模拟保存</button></div></section>
    <footer class="eh-footer"><span id="eh-status" role="status" aria-live="polite">修改只暂存在演示内存</span><span id="eh-density">行高 28 · 按钮 26 · 输入 28</span></footer>
  </main>
  <script>
  (() => {
    const root = document.getElementById('envhosts-repair');
    const $ = s => root.querySelector(s), $$ = s => [...root.querySelectorAll(s)];
    const clone = v => JSON.parse(JSON.stringify(v));
    const escape = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const part = (id,value) => ({id,value,deleted:false});
    const variable = (id,scope,name,value,type='REG_SZ') => ({id,scope,name,value,type,deleted:false,parts:value.split(';').map((v,i)=>part(id+'-p'+i,v))});
    const envBase = [variable('u-path','user','Path','%USERPROFILE%\\bin;C:\\Tools\\bin;D:\\SDK\\bin;C:\\Git\\cmd','REG_EXPAND_SZ'),variable('u-java','user','JAVA_HOME','C:\\SDK\\jdk-21'),variable('u-mode','user','DEV_MODE','development'),variable('u-temp','user','TEMP','%USERPROFILE%\\AppData\\Local\\Temp','REG_EXPAND_SZ'),variable('u-cache','user','APP_CACHE','D:\\Cache'),variable('u-editor','user','EDITOR','code'),variable('s-path','system','Path','%SystemRoot%\\System32;%SystemRoot%;C:\\Program Files\\Tools','REG_EXPAND_SZ'),variable('s-root','system','SystemRoot','C:\\Windows'),variable('s-cpu','system','NUMBER_OF_PROCESSORS','16'),variable('s-sdk','system','SDK_ROOT','D:\\SDK')];
    const hostBase = [{id:'h-local',line:1,ip:'127.0.0.1',names:'localhost',comment:'本机',enabled:true,deleted:false},{id:'h-ipv6',line:2,ip:'::1',names:'localhost',comment:'IPv6',enabled:true,deleted:false},{id:'h-api',line:5,ip:'127.0.0.1',names:'api.test',comment:'本地接口',enabled:false,deleted:false},{id:'h-web',line:6,ip:'127.0.0.1',names:'web.test www.web.test',comment:'本地页面',enabled:true,deleted:false},{id:'h-db',line:8,ip:'192.0.2.20',names:'db.test',comment:'测试库',enabled:false,deleted:false},{id:'h-old',line:9,ip:'192.0.2.30',names:'old.test',comment:'旧映射',enabled:true,deleted:false}];
    const originalLines = ['# EnvHosts 合成示例','127.0.0.1 localhost # 本机','::1 localhost # IPv6','','# 本地开发环境','# 127.0.0.1 api.test # 本地接口','127.0.0.1 web.test www.web.test # 本地页面','# 临时测试','# 192.0.2.20 db.test # 测试库','192.0.2.30 old.test # 旧映射','unknown legacy line',''];
    const initialHosts = clone(hostBase); initialHosts.find(r=>r.id==='h-old').deleted=true;
    const stores = {env:{base:clone(envBase),work:clone(envBase),past:[],future:[]},hosts:{base:clone(hostBase),work:initialHosts,past:[clone(hostBase)],future:[]}};
    const view = (current,selected=[])=>({filter:'',selected,anchor:current,current,sort:'',descending:false});
    const views = {user:view('u-path',['u-path']),system:view('s-path',['s-path']),hosts:view('h-api',['h-api'])};
    const partViews = {'u-path':view('u-path-p0',['u-path-p0','u-path-p1'])};
    const widths = {env:[{key:'name',label:'变量名',width:182,min:100,max:480},{key:'value',label:'值',width:320,min:160,max:800},{key:'type',label:'类型',width:150,min:130,max:300},{key:'state',label:'修改状态',width:94,min:88,max:220}],hosts:[{key:'enabled',label:'启停',width:90,min:82,max:180},{key:'ip',label:'IP',width:150,min:110,max:380},{key:'names',label:'主机名',width:280,min:140,max:700},{key:'comment',label:'行尾注释',width:180,min:120,max:600},{key:'state',label:'修改状态',width:94,min:88,max:220}]};
    let nextPartId=1;
    let target='env',scope='user',hostPage='entries',mode='parts',edit=null,partEditing='',review=false,drag=null,theme='auto',tableSignature='',partsSignature='';
    const design={density:'紧凑',systemReadOnly:false};
    const store=()=>stores[target], currentView=()=>views[target==='env'?scope:'hosts'];
    const rows=()=>{const v=currentView();let out=store().work.filter(r=>!(r.deleted&&store().base.find(b=>b.id===r.id)?.deleted)).filter(r=>target==='hosts'||r.scope===scope).filter(r=>!v.filter||[r.name,r.value,r.ip,r.names,r.comment].join(' ').toLowerCase().includes(v.filter.toLowerCase()));if(v.sort)out.sort((a,b)=>String(a[v.sort]).localeCompare(String(b[v.sort]),'zh-CN')*(v.descending?-1:1));return out;};
    const row=()=>store().work.find(r=>r.id===currentView().current);
    const writable=r=>r&&!r.deleted&&!(target==='env'&&r.scope==='system'&&design.systemReadOnly);
    const partView=()=>partViews[currentView().current]||(partViews[currentView().current]=view('',[]));
    const changed=r=>{const b=store().base.find(v=>v.id===r.id);const fields=target==='env'?['name','value','type','deleted']:['ip','names','comment','enabled','deleted'];return !b||fields.some(k=>r[k]!==b[k]);};
    const dirty=()=>store().work.filter(changed);
    const status=s=>{$('#eh-status').textContent=s;};
    function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{target,scope,density:design.density},privateContent:{theme}}).catch(()=>{});}
    function error(s){$('#eh-error').textContent=s;$('#eh-error').hidden=!s;}
    function change(fn){const s=store(),before=clone(s.work);fn();if(JSON.stringify(before)!==JSON.stringify(s.work)){s.past.push(before);s.future=[];}review=false;render();}
    function prune(){const v=currentView(),ids=rows().map(r=>r.id);v.selected=v.selected.filter(id=>ids.includes(id));if(!ids.includes(v.current))v.current=ids[0]||'';if(!ids.includes(v.anchor))v.anchor=v.current;}
    function choose(id,event,parts=false){
      const v=parts?partView():currentView(),ids=parts?(row()?.parts||[]).map(p=>p.id):rows().map(r=>r.id);
      if(event.shiftKey&&ids.includes(v.anchor)){const a=ids.indexOf(v.anchor),b=ids.indexOf(id),range=ids.slice(Math.min(a,b),Math.max(a,b)+1);v.selected=(event.ctrlKey||event.metaKey)?[...new Set([...v.selected,...range])]:range;}
      else if(event.ctrlKey||event.metaKey){v.selected=v.selected.includes(id)?v.selected.filter(x=>x!==id):[...v.selected,id];v.anchor=id;}

    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{if(finish()){render();remember();}}});tweak.addSelect(design,'density',{label:'桌面密度',options:['紧凑','舒适']});tweak.addToggle(design,'systemReadOnly',{label:'系统变量只读情境'});}
  })();
  </script>
</div>
