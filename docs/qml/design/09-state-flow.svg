<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">P09 · 状态转换 · 编辑与写入分开</title>
<desc id="desc">自动暂存只改变工作副本；错误、冲突和取消都有明确返回路径。。QML 目标设计示意，并非运行截图，数据均为虚构。</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#12233a" flood-opacity=".08"/></filter></defs>
